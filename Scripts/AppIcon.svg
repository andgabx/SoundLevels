<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6ECDD"/>
      <stop offset="100%" stop-color="#EEDFC8"/>
    </linearGradient>
  </defs>

  <!-- macOS squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>

  <!-- three fader tracks -->
  <rect x="275" y="232" width="90" height="560" rx="45" fill="#DCC7A9" stroke="#C7AE8A" stroke-width="4"/>
  <rect x="467" y="232" width="90" height="560" rx="45" fill="#DCC7A9" stroke="#C7AE8A" stroke-width="4"/>
  <rect x="659" y="232" width="90" height="560" rx="45" fill="#DCC7A9" stroke="#C7AE8A" stroke-width="4"/>

  <!-- fader thumbs, set at different levels -->
  <rect x="245" y="670" width="150" height="60" rx="30" fill="#4E2F1B"/>
  <rect x="437" y="270" width="150" height="60" rx="30" fill="#4E2F1B"/>
  <rect x="629" y="470" width="150" height="60" rx="30" fill="#4E2F1B"/>
</svg>
